org.gradle.jvmargs=-Xmx2G
# Disabled: Loom 1.17's :jar task customization captures a non-serializable Gradle
# script object reference, which fails configuration-cache storage (build itself
# succeeds either way - this only affects the incremental-build speedup).
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# As of 26.2, Fabric Loom defaults to official Mojang mappings - no yarn_mappings needed.
minecraft_version=26.2
loader_version=0.20.1
jdk_version=25

# Mod Properties
mod_version=26.2.2-pre1
maven_group=com.stashhunter
archives_base_name=stash-hunter

# Dependencies
# Optional Baritone integration (com.stashhunter.stashhunter.baritone) - matches the
# MeteorDevelopment/baritone 26.2 branch, published to maven.meteordev.org/snapshots.
baritone_version=26.2-SNAPSHOT
# Optional Xaero's Minimap integration (com.stashhunter.stashhunter.xaero), compile-time only.
xaero_minimap_version=fabric-26.2-26.6.2
